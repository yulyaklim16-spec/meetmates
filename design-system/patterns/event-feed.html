<!--
  Паттерн: Лента карточек события
  Экраны: feed, invite, my-events, profile
  Из чего: mm-list, mm-event, mm-cover, mm-cardtop, mm-chip, mm-event-body,
    mm-event-head, mm-meta, mm-facts, mm-btn
  Варианты: mm-event-acts — действий нет только в «моих событиях»: своё
    событие не просят, в него уже идёшь
  Когда брать: экран отвечает на «куда пойти». Карточка — инструмент
    «посмотреть и выбрать», и снимок в ней решает, а не уточняет.
  Когда не брать: экран отвечает на «что нашлось» — выдача поиска. Там строка
    с миниатюрой, и действий на ней нет (D-67, D-70).
  Действие стоит на самой карточке (D-54): открывать событие ради той же
    кнопки не нужно. Где мест два и больше, рядом встаёт `Invite`.
-->

<ul class="mm-list">
  <li class="mm-event">
    <span class="mm-cover"><img data-img="ev-games" alt="" loading="lazy">
      <span class="mm-cardtop"><span class="mm-chip"><span class="mm-ico" data-ico="pin" aria-hidden="true"></span>~3 km</span></span>
    </span>
    <span class="mm-event-body">
      <a class="mm-event-head" href="#"><b>Board games</b><time class="mm-meta" datetime="2026-09-26T18:00"><b>26 Sep</b> &middot; 18:00</time></a>
      <span class="mm-facts">Kyiv Games Club &middot; Podil</span>
      <span class="mm-facts">2 going &middot; 1 spot left</span>
    </span>
    <span class="mm-event-acts"><a class="mm-btn mm-btn--primary" href="#">Ask to join</a></span>
  </li>
  <li class="mm-event">
    <span class="mm-cover"><img data-img="ev-run" alt="" loading="lazy">
      <span class="mm-cardtop"><span class="mm-chip"><span class="mm-ico" data-ico="pin" aria-hidden="true"></span>~1 km</span></span>
    </span>
    <span class="mm-event-body">
      <a class="mm-event-head" href="#"><b>Morning run along the embankment</b><time class="mm-meta">No date yet</time></a>
      <span class="mm-facts">Podil &middot; ~1 km</span>
      <span class="mm-facts">1 going &middot; 2 spots left</span>
    </span>
    <span class="mm-event-acts">
      <a class="mm-btn mm-btn--primary" href="#">Ask to join</a>
      <a class="mm-btn mm-btn--quiet" href="#">Invite</a>
    </span>
  </li>
</ul>
