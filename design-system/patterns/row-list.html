<!--
  Паттерн: Список строк
  Экраны: chats, my-profile, search
  Из чего: mm-list, mm-row, mm-row-head
  Варианты: mm-meta — время и счётчик справа; mm-facts — вторая строка;
    mm-avatar и mm-thumb — лицо кругом, обложка квадратом
  Когда брать: экран отвечает на «что у меня есть» или «что нашлось». Строка —
    инструмент «найти и перейти»: заголовок, время справа, факты второй строкой.
  Когда не брать: по снимку принимают решение. Тогда это карточка во всю
    ширину, а не строка с миниатюрой.
  Форма миниатюры говорит, что нашлось, раньше имени: у человека круг,
    у события — скруглённый квадрат (D-70).
-->

<!-- Строка чата: аватар внутри строки фактов, время и непрочитанные справа -->

</ul>
